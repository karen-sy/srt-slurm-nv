name: vllm_dsv4_pure_disagg_ctx6dep4_gen1dep16_c768

identity:
  model:
    repo: deepseek-ai/DeepSeek-V4-Pro
  frameworks:
    dynamo: 1.2.0
    vllm: 0.23.0

model:
  path: DeepSeek-V4-Pro
  container: dyn-130-vllm-0230-condp-kvrouting-isl-and-load-vllmpull
  precision: fp4

resources:
  gpu_type: gb200
  gpus_per_node: 4
  prefill_nodes: 6
  prefill_workers: 6
  gpus_per_prefill: 4
  decode_nodes: 4
  decode_workers: 1
  gpus_per_decode: 16

slurm:
  time_limit: "00:50:00"

backend:
  type: vllm
  kv_events_config:
    prefill: true
    decode: true
  prefill_environment:
    OTEL_SERVICE_NAME: "dynamo-prefill-dsv4-ctx6dep4"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    DYN_TOOL_CALL_PARSER: deepseek_v4
    DYN_REASONING_PARSER: deepseek_v4
  decode_environment:
    OTEL_SERVICE_NAME: "dynamo-decode-dsv4-gen1dep16"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    DYN_TOOL_CALL_PARSER: deepseek_v4
    DYN_REASONING_PARSER: deepseek_v4
  vllm_config:
    prefill:
      served-model-name: deepseek-ai/DeepSeek-V4-Pro
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 4
      data-parallel-rpc-port: 29500
      trust-remote-code: true
      kv-cache-dtype: fp8
      block-size: 256
      enable-expert-parallel: true
      enforce-eager: true
      max-model-len: 262144
      max-num-seqs: 16
      max-num-batched-tokens: 32768
      enable-prefix-caching: true
      no-async-scheduling: true
      gpu-memory-utilization: 0.8
      no-disable-hybrid-kv-cache-manager: true
      tokenizer-mode: deepseek_v4
      attention-config: '{"use_fp4_indexer_cache":true}'
      moe-backend: deep_gemm_mega_moe
      speculative-config: '{"method":"mtp","num_speculative_tokens":3,"rejection_sample_method":"synthetic","synthetic_acceptance_length":2.48}'
      kv-cache-metrics: true
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
      otlp-traces-endpoint: "http://10.57.209.4:4317"
    decode:
      served-model-name: deepseek-ai/DeepSeek-V4-Pro
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      data-parallel-size: 16
      data-parallel-rpc-port: 29500
      trust-remote-code: true
      kv-cache-dtype: fp8
      block-size: 256
      enable-expert-parallel: true
      max-model-len: 262144
      max-num-seqs: 128
      max-cudagraph-capture-size: 128
      max-num-batched-tokens: 4352
      enable-prefix-caching: true
      gpu-memory-utilization: 0.9
      compilation-config: '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
      stream-interval: 50
      no-disable-hybrid-kv-cache-manager: true
      tokenizer-mode: deepseek_v4
      attention-config: '{"use_fp4_indexer_cache":true}'
      moe-backend: deep_gemm_mega_moe
      speculative-config: '{"method":"mtp","num_speculative_tokens":3,"rejection_sample_method":"synthetic","synthetic_acceptance_length":2.48}'
      kv-cache-metrics: true
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
      otlp-traces-endpoint: "http://10.57.209.4:4317"

frontend:
  type: dynamo
  args:
    router-mode: kv
    router-reset-states: true
  enable_multiple_frontends: false
  env:
    OTEL_SERVICE_NAME: "dynamo-frontend-dsv4-ctx6dep4-gen1dep16"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"

health_check:
  max_attempts: 540
  interval_seconds: 10

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 24

observability:
  enable_otel: true
  otel_endpoint: "http://10.57.209.4:4317"

sweep:
  concurrency: [768]

benchmark:
  type: trace-replay-sa
  public_dataset: semianalysis_cc_traces_weka_062126_256k
  num_dataset_entries: 470
  concurrencies: "{concurrency}"
  ttft_threshold_ms: 30000
  itl_threshold_ms: 50
  aiperf_package: "git+https://github.com/SemiAnalysisAI/aiperf.git@e3920297890b3532970b672a23561a369eb30c35"
  aiperf_args:
    benchmark-duration: 1800
    benchmark-grace-period: 60
    request-timeout-seconds: 1800
    workers-max: 1200
    record-processors: 16
    profile-export-level: raw
    concurrency-ramp-duration: 180
    export-http-trace: true
