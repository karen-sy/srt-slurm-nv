#
# Fix verification for PR #10552 (ds-tail-copy i64 offsets).
# Reproduces cudaErrorIllegalAddress in ds_conv_tail_copy_kernel under sustained
# agentic/chat load with prefix caching + DS layout + MTP.
#
# Prerequisites:
#   export NEMOTRON_ULTRA_CONTAINER=/path/to/your-built-image.sqsh
#   export NEMOTRON_ULTRA_MODEL_PATH=/path/to/patched/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
#
# The model dir must contain ultra_v3_reasoning_parser.py (patched model view,
# same as what the K8s model-download Job produces).
#
# Submit:
#   cd ~/srt-slurm
#   uv run -m srtctl.cli.submit recipes/nemotron-fi/chat_mtp_spec1.yaml
#
# To test spec-step=2 or spec-step=5, copy this file and change spec-tokens below.
name: nemotron-fi-chat-mtp-spec1

identity:
  model:
    repo: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
  frameworks:
    dynamo: "1.3.0"

model:
  path: ${NEMOTRON_ULTRA_MODEL_PATH}
  container: ${NEMOTRON_ULTRA_CONTAINER}
  precision: nvfp4

resources:
  gpu_type: gb200
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 4
  gpus_per_node: 4

slurm:
  time_limit: "02:30:00"

infra:
  health_check:
    max_attempts: 360   # 60 min — 550B on GB200 takes ~40 min to load
    interval_seconds: 10

backend:
  type: vllm
  connector: null       # agg mode — no P/D KV transfer connector needed
  kv_events_config:
    aggregated: true    # publish ZMQ KV events so the frontend can do KV-aware routing
  aggregated_environment:
    VLLM_DISABLED_KERNELS: FlashInferFP8ScaledMMLinearKernel
    VLLM_SSM_CONV_STATE_LAYOUT: DS      # required to trigger the ds_conv_tail_copy_kernel path
    VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE: "1"
    DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS: "0"
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
    NCCL_IB_DISABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    PYTHONHASHSEED: "0"
    VLLM_LOGGING_LEVEL: INFO
  vllm_config:
    aggregated:
      served-model-name: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
      tensor-parallel-size: 4
      trust-remote-code: true
      max-model-len: 262144
      max-num-seqs: 64
      max-num-batched-tokens: 32768
      gpu-memory-utilization: 0.9
      no-enable-flashinfer-autotune: true
      block-size: 64
      enable-expert-parallel: true
      mamba-cache-mode: align           # required to trigger the bug path
      enable-prefix-caching: true       # required to trigger the bug path
      spec-method: nemotron_h_mtp       # MTP required to trigger the bug path
      spec-tokens: 1                    # change to 2 or 5 for optional spec-step testing
      dyn-tool-call-parser: qwen3_coder
      dyn-reasoning-parser: nemotron3
      reasoning-parser-plugin: /model/ultra_v3_reasoning_parser.py
      reasoning-parser: nemotron_v3
      no-disable-hybrid-kv-cache-manager: true

frontend:
  type: dynamo
  args:
    router-mode: kv
    router-kv-events: true
    kv-cache-block-size: 64
    router-reset-states: true

benchmark:
  type: trace-replay
  # chat 15% trace — 1805 rows, ISL ~8k, OSL ~1k
  trace_file: /traces/nim_turbo_8k_1k_70kv_chat_new_noschedule_short_15perc.jsonl
  concurrencies:
    - 18
  # Crash typically appears within 5-15 min at c≥4; c=18 matches recipe reference concurrency.
  # Without the fix: expect cudaErrorIllegalAddress in vllm worker logs.
  # With the fix:    full trace replay completes; check artifacts for goodput numbers.
  aiperf_package: "aiperf==0.8.0"
  aiperf_env:
    AIPERF_HTTP_CONNECTION_LIMIT: "200"           # must be ≥ concurrency; default is too low for c=18
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: "3600"  # 550B model takes time to configure
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: "3600"      # large trace file needs time to load
  aiperf_args:
    num-requests: 1805                # replay full 15% trace
    prompt-input-tokens-block-size: 512
    use-server-token-count: true
    request-timeout-seconds: 1200
    workers-max: 18

extra_mount:
  - /lustre/fsw/coreai_dlfw_dev/karenc/dynamo/recipes/nemotron-3-ultra/perf/traces:/traces
