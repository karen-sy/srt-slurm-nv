#
# Fix verification for PR #10552 — agentic workload variant.
# Higher ISL (~64k) makes the conv-state tail-copy offset exceed 2^31 more aggressively
# than the chat trace, so this is the more sensitive crash trigger per the issue report.
#
# Prerequisites: same as chat_mtp_spec1.yaml
#   export NEMOTRON_ULTRA_CONTAINER=/path/to/your-built-image.sqsh
#   export NEMOTRON_ULTRA_MODEL_PATH=/path/to/patched/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
name: nemotron-fi-agentic-mtp-spec1

identity:
  model:
    repo: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
  frameworks:
    dynamo: "1.3.0"

model:
  path: ${NEMOTRON_ULTRA_MODEL_PATH}
  container: ${NEMOTRON_ULTRA_CONTAINER}
  precision: nvfp4

resources:
  gpu_type: gb200
  agg_nodes: 1
  agg_workers: 1
  gpus_per_agg: 4
  gpus_per_node: 4

slurm:
  time_limit: "02:30:00"

infra:
  health_check:
    max_attempts: 360
    interval_seconds: 10

backend:
  type: vllm
  connector: null
  aggregated_environment:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HOME: /tmp
    HF_MODULES_CACHE: /tmp/hf_modules
    XDG_CACHE_HOME: /tmp/cache
    TORCH_EXTENSIONS_DIR: /tmp/torch_extensions
    TRITON_CACHE_DIR: /tmp/triton
    VLLM_CACHE_ROOT: /tmp/vllm
    PYTHONHASHSEED: "0"
    VLLM_LOGGING_LEVEL: INFO
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
    VLLM_DISABLED_KERNELS: FlashInferFP8ScaledMMLinearKernel
    VLLM_SSM_CONV_STATE_LAYOUT: DS
    VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE: "1"
    DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS: "0"
    NCCL_IB_DISABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    DYN_LOG: "info,dynamo_kv_router=debug,dynamo_llm::kv_router=debug"
  vllm_config:
    aggregated:
      served-model-name: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
      tensor-parallel-size: 4
      trust-remote-code: true
      max-model-len: 262144
      max-num-seqs: 24              # agentic recipe uses 24 (vs 64 for chat)
      max-num-batched-tokens: 32768
      gpu-memory-utilization: 0.9
      no-enable-flashinfer-autotune: true
      block-size: 64
      enable-expert-parallel: true
      mamba-cache-mode: align
      enable-prefix-caching: true
      spec-method: nemotron_h_mtp
      spec-tokens: 1
      dyn-tool-call-parser: qwen3_coder
      dyn-reasoning-parser: nemotron3
      reasoning-parser-plugin: /model/ultra_v3_reasoning_parser.py
      reasoning-parser: nemotron_v3
      no-disable-hybrid-kv-cache-manager: true

frontend:
  type: dynamo
  args:
    router-mode: kv
    router-kv-events: true
    kv-cache-block-size: 64
    router-reset-states: true

benchmark:
  type: trace-replay
  # agentic 15% trace — 3541 rows, ISL ~64k, OSL ~400 — highest crash rate per issue
  trace_file: /traces/nim_turbo_64k_400_90kv_agent_new_noschedule_short_15perc.jsonl
  concurrencies:
    - 20
  aiperf_package: "aiperf==0.8.0"
  aiperf_env:
    AIPERF_HTTP_CONNECTION_LIMIT: "200"
    AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT: "3600"
    AIPERF_DATASET_CONFIGURATION_TIMEOUT: "3600"
  aiperf_args:
    num-requests: 3541
    prompt-input-tokens-block-size: 512
    use-server-token-count: true
    request-timeout-seconds: 1200
    workers-max: 20

extra_mount:
  - /lustre/fsw/coreai_dlfw_dev/karenc/dynamo/recipes/nemotron-3-ultra/perf/traces:/traces
