# Matched against 2178352/2178348: best no-offload sticky qNone + decode gate 0.90.
# Goal: isolate vLLM NIXL bidirectional D->P pull on the 14GPU champion topology.
name: condp_sticky_bidi_14gpu_tep4x2p_tep2x3d_decode_gate_nooffload

identity:
  model:
    repo: nvidia/qwen3-235b-a22b-instruct-2507-nvfp4
  frameworks:
    dynamo: 1.3.0
    vllm: 0.23.0+cu13

model:
  path: qwen3-235b-a22b-instruct-2507-nvfp4
  container: dyn-130-vllm-0230-condp-kvrouting-isl-and-load-vllmpull
  precision: fp4

resources:
  gpu_type: gb200
  gpus_per_node: 4
  prefill_nodes: 2
  prefill_workers: 2
  gpus_per_prefill: 4
  decode_nodes: 3
  decode_workers: 3
  gpus_per_decode: 2

slurm:
  time_limit: "00:45:00"

backend:
  type: vllm
  connector: null  # to prevent srtctl adding a default --kv-transfer-config
  kv_events_config:
    prefill: true
    decode: true
  prefill_environment:
    OTEL_SERVICE_NAME: "dynamo-prefill-tep4x2-kv"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    VLLM_NIXL_SIDE_CHANNEL_PORT: "5600"
    UCX_NET_DEVICES: "all"
    VLLM_USE_FLASHINFER_MOE_FP4: "1"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    DYN_TOOL_CALL_PARSER: hermes
    DYN_REASONING_PARSER: qwen3
  decode_environment:
    OTEL_SERVICE_NAME: "dynamo-decode-tep2x3-kv"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    VLLM_NIXL_SIDE_CHANNEL_PORT: "5700"
    UCX_NET_DEVICES: "all"
    VLLM_USE_FLASHINFER_MOE_FP4: "1"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    DYN_TOOL_CALL_PARSER: hermes
    DYN_REASONING_PARSER: qwen3
  vllm_config:
    prefill:
      tensor-parallel-size: 4
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      max-model-len: 262144
      block-size: 64
      max-num-batched-tokens: 32768
      enable-prefix-caching: true
      kv-cache-metrics: true
      kv-cache-dtype: fp8
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_connector_extra_config":{"bidirectional_kv_xfer":true}}'
      disaggregation-mode: prefill
      enable-conditional-disagg: true
      trust-remote-code: true
      otlp-traces-endpoint: "http://10.57.209.4:4317"
    decode:
      tensor-parallel-size: 2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      max-model-len: 262144
      block-size: 64
      max-num-batched-tokens: 4352
      enable-prefix-caching: true
      kv-cache-metrics: true
      kv-cache-dtype: fp8
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"bidirectional_kv_xfer":true,"decoder_kv_blocks_ttl":10}}'
      disaggregation-mode: decode
      enable-conditional-disagg: true
      trust-remote-code: true
      otlp-traces-endpoint: "http://10.57.209.4:4317"

frontend:
  type: dynamo
  args:
    router-mode: kv
    router-reset-states: true
    router-conditional-disagg: true
    router-conditional-disagg-policy: isl_or_load
    router-conditional-disagg-eff-isl-threshold: 4096
    router-conditional-disagg-eff-isl-ratio-threshold: 0.8
    router-conditional-disagg-prefill-busy-threshold: 16
    router-conditional-disagg-decode-busy-threshold: "{decode_busy_threshold}"
    router-queue-threshold: "{queue_threshold}"
  enable_multiple_frontends: false
  env:
    OTEL_SERVICE_NAME: "dynamo-frontend-bidi-sticky-tep4x2p-tep2x3d-decodegate"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    DYN_ENABLE_VLLM_NIXL_BIDIRECTIONAL_KV: "1"
    DYN_VLLM_NIXL_BIDIRECTIONAL_KV_TTL_SECS: "450"

health_check:
  max_attempts: 500
  interval_seconds: 10

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 24

observability:
  enable_otel: true
  otel_endpoint: "http://10.57.209.4:4317"

sweep:
  concurrency: [96, 80]
  queue_threshold: [None]
  decode_busy_threshold: [0.90]

extra_mount:
  - "/lustre/fsw/coreai_dlfw_dev/karenc/srt-slurm/traces:/traces"

benchmark:
  type: trace-replay-sa
  public_dataset: semianalysis_cc_traces_weka_with_subagents_256k
  num_dataset_entries: 470
  concurrencies: "{concurrency}"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "git+https://github.com/SemiAnalysisAI/aiperf.git@4c6525ab71d4cd9fc01054410d5b88bfe4feff9e"
  aiperf_args:
    benchmark-duration: 1500
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 120
    export-http-trace: true
