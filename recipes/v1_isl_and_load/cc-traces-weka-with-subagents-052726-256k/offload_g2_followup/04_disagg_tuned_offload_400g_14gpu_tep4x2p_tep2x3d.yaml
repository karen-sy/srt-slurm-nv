# Optional P4 from offload_g2_probe_recap.md:
# clone the tuned disagg offload block256 baseline and increase decode G2 to 400GiB.
#
# Matched references:
# - tuned disagg decode offload block256 c96/c80: 2180791 / 2180792
name: offload_g2_followup_disagg_tuned_offload_400g_14gpu_tep4x2p_tep2x3d

identity:
  model:
    repo: nvidia/qwen3-235b-a22b-instruct-2507-nvfp4
  frameworks:
    dynamo: 1.2.0
    vllm: 0.21.0+cu129

model:
  path: qwen3-235b-a22b-instruct-2507-nvfp4
  container: dyn-123-vllm-0240-versionbump-and-g2-metrics
  precision: fp4

resources:
  gpu_type: gb200
  gpus_per_node: 4
  prefill_nodes: 2
  prefill_workers: 2
  gpus_per_prefill: 4
  decode_nodes: 3
  decode_workers: 3
  gpus_per_decode: 2

slurm:
  time_limit: "00:45:00"

backend:
  type: vllm
  kv_events_config:
    prefill: true
    decode: true
  prefill_environment:
    OTEL_SERVICE_NAME: "dynamo-prefill-g2-followup-tep4x2-kv"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    VLLM_NIXL_SIDE_CHANNEL_PORT: "5600"
    UCX_NET_DEVICES: "all"
    VLLM_USE_FLASHINFER_MOE_FP4: "1"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    DYN_TOOL_CALL_PARSER: hermes
    DYN_REASONING_PARSER: qwen3
  decode_environment:
    OTEL_SERVICE_NAME: "dynamo-decode-g2-followup-400g-tep2x3-kv"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"
    VLLM_NIXL_SIDE_CHANNEL_PORT: "5700"
    UCX_NET_DEVICES: "all"
    VLLM_USE_FLASHINFER_MOE_FP4: "1"
    VLLM_USE_NCCL_SYMM_MEM: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    DYN_TOOL_CALL_PARSER: hermes
    DYN_REASONING_PARSER: qwen3
  vllm_config:
    prefill:
      tensor-parallel-size: 4
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      max-model-len: 262144
      block-size: 64
      max-num-batched-tokens: 32768
      enable-prefix-caching: true
      kv-cache-metrics: true
      kv-cache-dtype: fp8
      kv-transfer-config: '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
      disaggregation-mode: prefill
      trust-remote-code: true
      otlp-traces-endpoint: "http://10.57.209.4:4317"
    decode:
      tensor-parallel-size: 2
      enable-expert-parallel: true
      gpu-memory-utilization: 0.85
      max-model-len: 262144
      block-size: 64
      max-num-batched-tokens: 4352
      enable-prefix-caching: true
      kv-cache-metrics: true
      kv-cache-dtype: fp8
      # NIXL-first tuned offload baseline, but with nominal 400GiB G2.
      kv-transfer-config: '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer"},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":429496729600,"block_size":256,"store_threshold":2,"max_tracker_size":262144,"eviction_policy":"lru","offload_prompt_only":true}}]}}'
      disaggregation-mode: decode
      trust-remote-code: true
      otlp-traces-endpoint: "http://10.57.209.4:4317"

frontend:
  type: dynamo
  args:
    router-mode: kv
    router-reset-states: true
  enable_multiple_frontends: false
  env:
    OTEL_SERVICE_NAME: "dynamo-frontend-g2-followup-disagg-400g-tep4x2p-tep2x3d"
    OTEL_EXPORT_ENABLED: "true"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://10.57.209.4:4317"

health_check:
  max_attempts: 500
  interval_seconds: 10

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 24

observability:
  enable_otel: true
  otel_endpoint: "http://10.57.209.4:4317"

sweep:
  concurrency: [512, 256, 128, 96]

extra_mount:
  - "/lustre/fsw/coreai_dlfw_dev/karenc/srt-slurm/traces:/traces"

benchmark:
  type: trace-replay-sa
  public_dataset: semianalysis_cc_traces_weka_with_subagents_256k
  num_dataset_entries: 470
  concurrencies: "{concurrency}"
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: "git+https://github.com/cquil11/aiperf.git@062a5de92c8ac8a0a6dd5d2a7fb9a539a147f3d9"
  aiperf_args:
    benchmark-duration: 1500
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 120
    export-http-trace: true
