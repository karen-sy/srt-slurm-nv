# Starter P0 recipe. Review model/container aliases and trace mount before launch.
name: "p0-dsv4-pro-vllm-tep8-k2048"

identity:
  model:
    repo: deepseek-ai/DeepSeek-V4-Pro
  frameworks:
    dynamo: 1.3.0
    vllm: 0.25.1

model:
  path: "DeepSeek-V4-Pro"
  container: "dyn-130-vllm-0251-condp"
  precision: "fp4"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  agg_nodes: 2
  agg_workers: 1
  gpus_per_agg: 8

slurm:
  partition: gb200
  time_limit: "01:30:00"

backend:
  type: vllm
  connector: null

  aggregated_environment:
    PYTHONUNBUFFERED: "1"
    VLLM_ENGINE_READY_TIMEOUT_S: "5400"
    VLLM_SERVER_DEV_MODE: "1"
    VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"  # PR#43447: enable DSV4 sliding-window prefix-cache retention (default None=broken)
    VLLM_USE_NCCL_SYMM_MEM: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "1"
    NCCL_P2P_LEVEL: "NVL"
    # Dynamo ForwardPassMetrics (per-iteration) sampled every 10ms; files -> /logs (=outputs/<job>/logs on lustre, auto-collected)
    DYN_FPM_TRACE: "1"
    DYN_FPM_MODE: "sampled"
    DYN_FPM_SAMPLE_INTERVAL_MS: "10"
    DYN_FPM_OUTPUT_PATH: "/logs/dynamo-fpm"

  vllm_config:
    aggregated:
      served-model-name: "deepseek-ai/DeepSeek-V4-Pro"
      trust-remote-code: true
      kv-cache-dtype: "fp8"
      block-size: 256
      enable-prefix-caching: true
      max-model-len: 131072
      max-num-seqs: "{max_num_seqs}"
      max-num-batched-tokens: "{max_num_batched_tokens}"
      tensor-parallel-size: 8
      enable-expert-parallel: true
      gpu-memory-utilization: 0.9
      tokenizer-mode: deepseek_v4
      reasoning-parser: deepseek_v4
      compilation-config: '{"mode":3,"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"],"pass_config":{"fuse_allreduce_rms":true}}'
      attention-config: '{"use_fp4_indexer_cache":true}'
      moe-backend: deep_gemm_mega_moe
      no-enable-flashinfer-autotune: true
      kv-cache-metrics: true
      otlp-traces-endpoint: "http://10.57.209.4:4317"

frontend:
  type: dynamo
  enable_multiple_frontends: false

health_check:
  max_attempts: 540
  interval_seconds: 10

dynamo:
  install: false

observability:
  enable_otel: true
  otel_endpoint: "http://10.57.209.4:4317"

sweep:
  mode: zip
  parameters:
    concurrency: [16, 32, 64]
    max_num_seqs: [17, 33, 65]
    max_num_batched_tokens: [2064, 2080, 2112]

extra_mount:
  - "/lustre/fsw/coreai_dlfw_dev/karenc/dynamo-workflows/dynamo/disagg/conditional_prefill/theory/artifacts/p0-vllm-penalty/generated:/traces/p0-vllm-penalty"

benchmark:
  type: "modeling_itl_perf"
  trace_file: "/traces/p0-vllm-penalty"
  isl: 2048
  concurrencies: "{concurrency}"
  aiperf_package: "git+https://github.com/SemiAnalysisAI/aiperf.git@e3920297890b3532970b672a23561a369eb30c35"
  aiperf_args:
    export-http-trace: true
    profile-export-level: raw
    benchmark-duration: 2700  # 45 min cap; completes full grid when cache hits, bounds runaway if not
    benchmark-grace-period: 30
    request-timeout-seconds: 1200
    workers-max: 200
